name: ci

# ============================================================================
# CANONICAL CI — migrated to org-level reusable workflows on
# scitex-ai/.github@main (fleet-wide 2026-07-10 incident remediation,
# following the scitex-ai/scitex-stats PR #69 pilot). Each job below is a
# thin `uses:` caller into scitex-ai/.github; the actual pytest/import/
# audit/sphinx logic lives there now. Required-status-check contexts
# changed to "<caller-job-id> / <inner-job-name>" — see the comment above
# each job and the branch-protection update in the migration PR.
# ============================================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *" # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-matrix:
    # New required-status-check contexts:
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.11"
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.12"
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.13"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  import-smoke:
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  quality-audit:
    # New required-status-check context: "quality-audit / audit"
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit

  rtd-sphinx-build:
    # New required-status-check context: "rtd-sphinx-build / docs-sphinx"
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main
    secrets: inherit
