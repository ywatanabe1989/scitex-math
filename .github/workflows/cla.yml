name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # NOTE: the pre-migration job hardcoded path-to-document to
  # ywatanabe1989/scitex-dev/blob/main/CLA.md (a stale copy-paste from
  # before this repo had its own CLA.md). The reusable workflow rebuilds
  # the CLA doc URL from the CALLING repo (${{ github.repository }}),
  # i.e. ywatanabe1989/scitex-math/blob/main/CLA.md — this repo already
  # has its own CLA.md at the root with identical content, so this is a
  # same-content link fix, not a behavior regression.
  # owner_allowlist differs from the reusable default ("bot*,ywatanabe1989")
  # by the extra "LLEmacs" login — kept via explicit override below.
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets: inherit